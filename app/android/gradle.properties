# Tuned for this 2-vCPU / 7.8 GB / no-swap box.
# The Flutter template default (-Xmx8G + 4G metaspace) gets the daemon OOM-killed.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m
# run kotlinc inside the Gradle JVM: a second JVM does not fit in this container
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=false
